[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/quote/*"
  to = "/.netlify/functions/quote/:splat"
  status = 200

[[redirects]]
  from = "/fundamentals/*"
  to = "/.netlify/functions/fundamentals/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
